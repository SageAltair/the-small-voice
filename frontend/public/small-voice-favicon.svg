<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Favicon / smallest-scale version: dot + ONE ring only.
       Below ~24px the second ring loses legibility, so it is dropped
       entirely rather than shrunk — the mark degrades gracefully. -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#14283A" stroke-width="9"
          stroke-dasharray="123.4 90.2" stroke-linecap="round"
          transform="rotate(-110 50 50)"/>
  <circle cx="50" cy="50" r="11" fill="#F88321"/>
</svg>
