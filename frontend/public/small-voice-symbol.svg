<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- THE SMALL VOICE — Symbol: "The Rising Signal"
       A quiet point of origin (the small voice) surrounded by two open,
       asymmetric rings that spiral outward and upward — a small, true
       thing creating a real, expanding effect. The uneven gaps read as
       motion (rising/traveling), not a static target. -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#14283A" stroke-width="3.2"
          stroke-dasharray="139.57 74.06" stroke-linecap="round"
          transform="rotate(-95 50 50)"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="#14283A" stroke-width="3.8"
          stroke-dasharray="95.99 42.24" stroke-linecap="round"
          transform="rotate(-142 50 50)"/>
  <circle cx="50" cy="50" r="7.5" fill="#F88321"/>
</svg>
